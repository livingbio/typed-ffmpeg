[tool.uv.workspace]
members = [
    "packages/core",
    "packages/data-v5",
    "packages/data-v6",
    "packages/data-v7",
    "packages/data-v8",
    "packages/data-v9",
    "packages/v5",
    "packages/v6",
    "packages/v7",
    "packages/v8",
    "packages/v9",
    "packages/latest",
]

[project]
name = "typed-ffmpeg-workspace"
version = "0.0.0"
description = "Monorepo root for typed-ffmpeg — type-safe FFmpeg bindings for Python & TypeScript"
dependencies = [
    "ffmpeg-core",
    "ffmpeg-data-v5",
    "ffmpeg-data-v6",
    "ffmpeg-data-v7",
    "ffmpeg-data-v8",
    "ffmpeg-data-v9",
]
authors = [
    {name = "lucemia", email = "lucemia@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "ffmpeg",
    "video",
    "audio",
    "multimedia",
    "filter",
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
scripts = "scripts.main:app"

[project.urls]
Homepage = "https://lucemia.github.io/typed-ffmpeg/"
Repository = "https://github.com/lucemia/typed-ffmpeg"

[project.optional-dependencies]
graph = ["graphviz"]

[tool.uv]
sources = { ffmpeg-core = { workspace = true }, ffmpeg-data-v5 = { workspace = true }, ffmpeg-data-v6 = { workspace = true }, ffmpeg-data-v7 = { workspace = true }, ffmpeg-data-v8 = { workspace = true }, ffmpeg-data-v9 = { workspace = true } }

# PEP 735 dependency group. Must NOT be moved back to the legacy
# `[tool.uv] dev-dependencies`: uv merges both into the same `dev` group, and
# Dependabot writes bumps here, so having both makes the group contradict
# itself (`ruff==0.16.2` and `ruff==0.12.2`) and every uv update job fails.
[dependency-groups]
dev = [
    # Development tools
    "ty",
    "devtools",
    "black",
    "ruff==0.16.6",
    "prek>=0.4.13",
    "typer",
    "jinja2",
    "lxml",
    "build",
    
    # Testing
    "pytest-cov>=7.1.0,<8.0",
    "pytest-datadir>=1.8.0",
    "pytest-recording>=0.13.1",
    "pytest-asyncio>=1.4.0",
    "syrupy>=4.6.0",
    
    # Documentation
    "beautifulsoup4",
    "html2text",
    "mkdocs",
    "markdown-callouts>=0.4.0",
    "mkdocs-material>=9.5.9",
    "mkdocstrings>=1.0.6,<1.1",
    # Capped: 2.x removed the `order` option mkdocs.yml uses, and the
    # unbounded constraint let it in and broke the docs build.
    "mkdocstrings-python>=1.8.0,<3.0",
    "pymdown-extensions>=10.7",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "griffe_inherited_docstrings",
    "ipykernel>=7.3.0,<7.4.0",
    "mknotebooks",
]



[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["scripts"]
exclude = [
    "**/tests/**",
    "**/__snapshots__/**",
    "**/test_*",
    "**/*_test.py",
    "**/*.test.py",
    "**/conftest.py"
]

[tool.mypy]
exclude = "^(migrations|commands|sandbox|samples|sdk)/"
show_error_codes = true
implicit_optional = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 88
exclude = [
    "**/cassettes/",
    "**/__snapshots__/",
    # Generated bindings (filters, codecs, formats, streams, dag/io).
    # Match any major, like the ruff hook in .pre-commit-config.yaml: an
    # enumerated v5..v8 silently starts linting generated code the moment a new
    # version is added. NOTE packages/v8 and packages/v9 each declare their own
    # [tool.ruff], which makes ruff treat them as separate config roots, so this
    # exclude does not reach them -- `ruff check packages/` reports ~3.8k
    # findings in each. Pre-existing; prek is unaffected because its ruff hook
    # filters ^packages/v[0-9]+/src/ffmpeg/ before ruff runs.
    "packages/v*/src/ffmpeg/**",
]
src = ["src", "packages"]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["ffmpeg", "ffmpeg_core"]

[tool.ruff.lint]
select = [
    "DOC",
    "D",   # docstring 
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B006",   # flake8-bugbear: Do not use mutable data structures for argument defaults
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "D417",
    "D401",
    "D203", 
    "D212",
    "DOC502", 
    "E741",  # Ambiguous variable name: `I`
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "E712",  # not work for pandas
    "F811",  # FIXME: we relay on it to share fixture across app
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**.py" = ["D103", "D104", "D100", "DOC501"]
"packages/tests-shared/**" = ["D", "DOC"]
"packages/v*/**" = ["D", "DOC", "F401", "F821"]
"packages/core/**" = ["E741"]
"scripts/**" = ["D", "DOC"]
"ffmpeg/tools/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
markers = [
    "dev_only: marks tests to be run only on the main branch"
]
addopts = "--cov-report=term-missing"
asyncio_mode = "auto"
